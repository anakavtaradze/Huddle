name: Huddle tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Huddle-RN-Web-Preview/package-lock.json
      - run: npm ci
      - run: npm ci --prefix Huddle-RN-Web-Preview
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run check:web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
